[package]
name = "rome"
version = "0.3.0"
edition = "2021"
description = "SP-1 firmware flasher and stem manager"

[[bin]]
name = "rome"
path = "src/main.rs"

[dependencies]
rome-core = { path = "../rome-core" }
serialport = "4"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
