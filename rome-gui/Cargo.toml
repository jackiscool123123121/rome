[package]
name = "rome-gui"
version = "0.3.1"
edition = "2021"
description = "Desktop GUI for the SP-1 stem player companion tool"

[[bin]]
name = "rome-gui"
path = "src/main.rs"

[dependencies]
rome-core = { path = "../rome-core" }
anyhow = "1"
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
